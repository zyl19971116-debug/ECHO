services:
  web:
    build: .
    env_file: .env.production
    command: npm start
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"], interval: 30s, timeout: 5s, retries: 3 }
  ai-worker:
    build: .
    env_file: .env.production
    command: npm run worker
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  contest-worker:
    build: .
    env_file: .env.production
    command: npm run worker:contest
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  onchain-worker:
    build: .
    env_file: .env.production
    command: npm run worker:onchain
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: echo_market, POSTGRES_USER: echo_user, POSTGRES_PASSWORD: CHANGE_ME }
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U echo_user -d echo_market"], interval: 10s, timeout: 5s, retries: 5 }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "CHANGE_ME"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"], interval: 10s, timeout: 5s, retries: 5 }
    environment: { REDIS_PASSWORD: CHANGE_ME }
volumes:
  postgres_data:
  redis_data:
